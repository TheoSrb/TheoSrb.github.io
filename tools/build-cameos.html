<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Page d'atelier de tools/build-cameos.mjs : jamais servie en ligne
     (_redirects bloque /tools/). Les chemins partent de la racine du site. -->
<base href="../">
<title>Atelier des passants</title>
</head>
<body style="background:#222">
<script src="js/model-viewer.js"></script>
<script src="js/creature-3d.js"></script>
<script>
/* Les « passants » du pied de page : chaque bete qui marche, rendue de profil
   a 16 pixels par bloc (un pixel par texel, comme le jeu), image par image
   sur un tour de son animation de marche, puis rangee en planche horizontale.
   Resultat dans window.CAMEOS_RESULT (lu par tools/build-cameos.mjs). */
(async function () {
  const PX = 16;          /* pixels par bloc : un texel = un pixel */
  const FRAMES = 12;
  const PAD = 2;
  const SKIP = ['orca', 'boa'];  /* l'orque nage ; le boa, de profil, n'est qu'un trait */
  const THREE = await OW.loadThree();
  const models = await OW.creature3d.models();
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);
  if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  const out = {};

  for (const [slug, model] of Object.entries(models)) {
    if (SKIP.includes(slug)) continue;
    const walk = ['MOVE_WALK', 'MOVE_SWIM'].find((n) => model.anims[n]);
    if (!walk) continue;
    const len = model.anims[walk].len;

    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const sun = new THREE.DirectionalLight(0xffffff, 0.55);
    sun.position.set(0.4, 1, 0.8);
    scene.add(sun);
    const creature = OW.creature3d.build(THREE, model);
    scene.add(creature.object);
    /* La texture doit etre la avant la premiere image. */
    /* TextureLoader ne pose l'image qu'une fois chargee : on l'attend. */
    const mesh = creature.object.getObjectByProperty('type', 'Mesh');
    for (let i = 0; i < 100; i++) {
      const img = mesh && mesh.material.map && mesh.material.map.image;
      if (img && (img.complete === undefined || img.complete) && (img.width || img.naturalWidth)) break;
      await new Promise((r) => setTimeout(r, 50));
    }
    if (mesh && mesh.material.map) mesh.material.map.needsUpdate = true;

    /* La boite de toutes les poses du tour de marche. */
    const t0 = performance.now();
    creature.play(walk);
    const box = new THREE.Box3();
    for (let i = 0; i < FRAMES; i++) {
      creature.tick(t0 + (i / FRAMES) * len * 1000);
      creature.object.updateMatrixWorld(true);
      box.union(new THREE.Box3().setFromObject(creature.object));
    }
    /* De profil : on regarde le long de X, la bete avance vers -Z (son avant). */
    const wB = box.max.z - box.min.z;
    const hB = box.max.y - box.min.y;
    const W = Math.ceil(wB * PX) + PAD * 2;
    const H = Math.ceil(hB * PX) + PAD * 2;
    const cam = new THREE.OrthographicCamera(-W / 2 / PX, W / 2 / PX, H / 2 / PX, -H / 2 / PX, 0.1, 100);
    cam.position.set(20, (box.max.y + box.min.y) / 2, (box.max.z + box.min.z) / 2);
    cam.lookAt(0, cam.position.y, cam.position.z);
    renderer.setSize(W, H, false);

    const sheet = document.createElement('canvas');
    sheet.width = W * FRAMES;
    sheet.height = H;
    const ctx = sheet.getContext('2d');
    for (let i = 0; i < FRAMES; i++) {
      creature.tick(t0 + (i / FRAMES) * len * 1000);
      renderer.render(scene, cam);
      ctx.drawImage(renderer.domElement, i * W, 0);
    }
    out[slug] = {
      w: W, h: H, frames: FRAMES, seconds: +len.toFixed(3),
      /* La ligne du sol (y = 0 du modele), en pixels depuis le bas de la case. */
      ground: Math.round(PAD - box.min.y * PX),
      png: sheet.toDataURL('image/png')
    };
  }
  window.CAMEOS_RESULT = out;
}());
</script>
</body>
</html>
