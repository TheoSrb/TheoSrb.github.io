  <script>
    /* Theme, effets et langue avant le premier rendu : ni flash de fond, ni flash de texte.
     La traduction elle-meme (js/i18n.js) leve le voile des qu'elle est prete. */
    try {
      var t = localStorage.getItem('ow-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      var p = localStorage.getItem('ow-perf');
      if (p === 'full' || p === 'lite') document.documentElement.setAttribute('data-perf', p);
    } catch (e) {}
    (function () {
      var codes = ['fr', 'en', 'es', 'pt', 'ru'], l = null;
      try { l = localStorage.getItem('ow-lang'); } catch (e) {}
      if (codes.indexOf(l) < 0) {
        l = 'en';
        var list = navigator.languages || [navigator.language || 'en'];
        for (var i = 0; i < list.length; i++) {
          var k = String(list[i] || '').slice(0, 2).toLowerCase();
          if (codes.indexOf(k) >= 0) { l = k; break; }
        }
      }
      document.documentElement.lang = l;
      if (l !== 'fr') {
        document.documentElement.setAttribute('data-i18n-pending', '');
        setTimeout(function () { document.documentElement.removeAttribute('data-i18n-pending'); }, 1800);
      }
    })();
  </script>

<body data-page="items">

  <main class="page">
    <!-- En-tete ------------------------------------------------------------------ -->

      </div>
    </section>

    <!-- L'inventaire des objets : onglets, recherche, filtres ------------------------ -->
    <section class="section-tight" id="inventaire">
      <div class="wrap">
        <div class="inv" data-inv>
          <div class="inv-tabs" role="tablist" aria-label="Catégories d'objets" data-inv-tabs></div>
          <!-- La recherche sous les catégories, comme pour les blocs plus bas. -->
          <label class="inv-search inv-search-bar">
            <span class="visually-hidden">Rechercher un objet</span>
            <input type="search" placeholder="Rechercher un objet…" autocomplete="off" data-inv-search>
          </label>
          <div class="inv-window">
            <div class="inv-top">
              <span class="inv-title" data-inv-title>Tout</span>
            </div>
            <div class="inv-filters" data-inv-filters></div>
            <div class="inv-grid" data-inv-grid></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Les blocs : a part, en cubes, comme dans l'inventaire creatif ---------------- -->
    <section class="section" id="blocs">
      <div class="wrap stack" style="gap:22px">
        <div class="section-head" data-reveal="left">
          <span class="t-pixel t-accent">CONSTRUCTION</span>
          <h2 class="t-section">Blocs</h2>
          <span class="fill"></span>
        </div>
        <div class="blk" data-blk>
          <div class="blk-bar">
            <div class="filter-group" role="group" aria-label="Familles de blocs" data-blk-filters></div>
            <label class="inv-search blk-search">
              <span class="visually-hidden">Rechercher un bloc</span>
              <input type="search" placeholder="Rechercher un bloc…" autocomplete="off" data-blk-search>
            </label>
          </div>
          <div class="blk-grid" data-blk-grid></div>
        </div>
      </div>
    </section>

    <!-- L'infobulle du jeu ------------------------------------------------------------ -->
    <div class="inv-tooltip" data-inv-tip hidden></div>

    <!-- La fiche d'un objet -------------------------------------------------------------- -->
    <div class="modal item-modal" data-item-modal hidden>
      <button type="button" class="modal-scrim" data-fiche-close aria-label="Fermer"></button>
      <div class="modal-card fiche" role="dialog" aria-modal="true" aria-labelledby="fiche-title" data-fiche>
        <button type="button" class="btn-close fiche-close" data-fiche-close aria-label="Fermer"><svg class="px-ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 3h2v2H3zM11 3h2v2h-2zM5 5h2v2H5zM9 5h2v2H9zM7 7h2v2H7zM5 9h2v2H5zM9 9h2v2H9zM3 11h2v2H3zM11 11h2v2h-2z"/></svg></button>

      </div>
    </div>
