<script>
  /* Theme, effets et langue avant le premier rendu : ni flash de fond, ni flash de texte.
     La traduction elle-meme (js/i18n.js) leve le voile des qu'elle est prete. */
  try {
    var t = localStorage.getItem('ow-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var p = localStorage.getItem('ow-perf');
    if (p === 'full' || p === 'lite') document.documentElement.setAttribute('data-perf', p);
  } catch (e) {}
  (function () {
    var codes = ['fr', 'en', 'es', 'pt', 'ru'], l = null;
    try { l = localStorage.getItem('ow-lang'); } catch (e) {}
    if (codes.indexOf(l) < 0) {
      l = 'en';
      var list = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < list.length; i++) {
        var k = String(list[i] || '').slice(0, 2).toLowerCase();
        if (codes.indexOf(k) >= 0) { l = k; break; }
      }
    }
    document.documentElement.lang = l;
    if (l !== 'fr') {
      document.documentElement.setAttribute('data-i18n-pending', '');
      setTimeout(function () { document.documentElement.removeAttribute('data-i18n-pending'); }, 1800);
    }
  })();
</script>
